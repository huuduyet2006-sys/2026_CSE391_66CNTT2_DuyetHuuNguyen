<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Điểm Sinh Viên</title>
    <link rel="stylesheet" href="1.1.css">
</head>
<body>
    <div class="container">
        <h2>Quản lý Điểm Sinh Viên</h2>
        
        <div class="controls">
            <input type="text" id="txtName" placeholder="Họ tên sinh viên">
            <input type="number" id="txtScore" placeholder="Điểm (0-10)" step="0.1">
            <button id="btnAdd">Thêm vào bảng</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th>Điểm</th>
                    <th>Xếp loại</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                </tbody>
        </table>

        <div id="statistics">
            Tổng số sinh viên: <span>0</span> | Điểm trung bình: <span>0</span>
        </div>
    </div>

    <script src="1.1.js"></script>
</body>
</html>
