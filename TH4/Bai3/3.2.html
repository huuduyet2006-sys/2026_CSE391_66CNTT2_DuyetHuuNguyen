<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Multi-step Form - Duyệt 66CNTT2</title>
    <link rel="stylesheet" href="3.2.css">
</head>
<body>
    <div class="container">
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
            <div class="steps">
                <div class="step active">1</div>
                <div class="step">2</div>
                <div class="step">3</div>
            </div>
        </div>

        <form id="multiStepForm">
            <div class="form-step active" id="step1">
                <h2>Thông tin cá nhân</h2>
                <div class="form-group">
                    <label>Họ tên</label>
                    <input type="text" id="fullname" placeholder="Nhập họ tên">
                    <span class="error" id="name-error"></span>
                </div>
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="date" id="dob">
                    <span class="error" id="dob-error"></span>
                </div>
                <div class="form-group">
                    <label>Giới tính</label>
                    <select id="gender">
                        <option value="">Chọn giới tính</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                    <span class="error" id="gender-error"></span>
                </div>
                <button type="button" class="btn-next">Tiếp theo</button>
            </div>

            <div class="form-step" id="step2">
                <h2>Thông tin tài khoản</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                    <span class="error" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password">
                    <span class="error" id="pass-error"></span>
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="confirm">
                    <span class="error" id="confirm-error"></span>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-prev">Quay lại</button>
                    <button type="button" class="btn-next">Tiếp theo</button>
                </div>
            </div>

            <div class="form-step" id="step3">
                <h2>Xác nhận thông tin</h2>
                <div id="summary" class="summary-box">
                    </div>
                <div class="btn-group">
                    <button type="button" class="btn-prev">Quay lại</button>
                    <button type="submit" class="btn-submit">Hoàn tất</button>
                </div>
            </div>
        </form>
    </div>
    <script src="3.2.js"></script>
</body>
</html>
